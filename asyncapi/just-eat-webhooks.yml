summary: >-
  Just Eat Takeaway.com (JET Connect) pushes order-lifecycle and delivery-state
  events to partner-hosted webhook endpoints. Some are 'async' webhooks: invoked
  with a ?callback={returnUrl} query parameter, the receiver returns 202 Accepted
  immediately, then POSTs a {status, message, data} envelope to returnUrl on
  completion. Derived from the callback-style operations in the OpenAPI; this is
  the webhook catalog, not a published AsyncAPI document (no AsyncAPI is shipped).
delivery:
  transport: https-webhook-post
  async_pattern: '?callback={returnUrl} then POST 202/{status,message,data}'
  security: HTTPS required; partner API key / signed request per JET onboarding.
