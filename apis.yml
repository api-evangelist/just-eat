aid: just-eat
name: Just Eat
description: >-
  Just Eat Takeaway.com is a leading global online food-delivery marketplace,
  formed by the 2020 merger of Just Eat and Takeaway.com and headquartered in
  Amsterdam. It connects consumers with local restaurants and a last-mile
  delivery network across the UK, Europe, Australia/New Zealand and North
  America. Its public developer surface (developers.just-eat.com) exposes the
  Just Eat UK API for restaurant discovery and search, product catalogue and
  menu ingestion, order-lifecycle management, delivery-state tracking, checkout
  and basket, and consumer communication preferences, plus specialised partner
  integrations: JET Connect (point-of-sale) and JET Go (delivery as a service).
  Order-lifecycle and delivery-state events are pushed to partners through an
  extensive webhook surface, including async webhooks that use a callback URL.
