        required: true
      responses:
        '200':
          description: OK
      summary: Update order with driver on its way details
      tags:
      - publicly-accessible
  /orders/{orderId}/duedate:
    put:
      description: 'Use this to update the estimated time of arrival for an order (i.e. when you expect the customer to receive the food). NOTE: An initial estimate is given [upon acceptance](#/paths/~1orders~1{orderId}~1accept/put). This endpoint can be used to update that estimate.

